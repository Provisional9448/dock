[project]
name = "dock-clock"
version = "0.1.0"
description = "Free-time and detention clock. Emits clock_started and charge_risk events."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["dock-events"]

[project.scripts]
dock-clock = "dock_clock.cli:main"

[tool.uv.sources]
dock-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
